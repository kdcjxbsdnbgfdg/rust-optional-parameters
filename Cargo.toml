[package]
name = "optional_params"
version = "0.1.0"
edition = "2024"
license-file = "license"
description = "adds optional parameters to rust functions using macros"
repository = "https://github.com/kdcjxbsdnbgfdg/rust-optional-parameters"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.106"
quote = "1.0.45"
syn = { version = "2.0.117", features = ["full"] }
